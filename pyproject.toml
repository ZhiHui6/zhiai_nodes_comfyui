[project]
name = "zhiai-nodes-comfyui"
description = "A 52-node ComfyUI toolkit: multi-engine translation, prompt and tag/preset pickers, text utilities, LoRA stack management, image and video tools, local and online vision LLM nodes, hardware monitoring, and a built-in English/Chinese UI."
version = "2.0.0"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "Operating System :: OS Independent",
    "Environment :: GPU :: NVIDIA CUDA",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "opencv-python",
    "openai>=1.0.0",
    "nvidia-ml-py",
    "psutil",
    "cryptography",
    "scikit-image",
]

[project.urls]
Homepage = "https://github.com/ZhiHui6/zhiai_nodes_comfyui"
Repository = "https://github.com/ZhiHui6/zhiai_nodes_comfyui"
Documentation = "https://github.com/ZhiHui6/zhiai_nodes_comfyui#readme"
Issues = "https://github.com/ZhiHui6/zhiai_nodes_comfyui/issues"

[tool.comfy]
PublisherId = "zhihui6"
DisplayName = "ZhiAI Nodes"
Icon = "https://raw.githubusercontent.com/ZhiHui6/zhiai_nodes_comfyui/main/icon.png"
includes = [
    "Nodes/TypeDesigner/Preview_images",
    "Nodes/SystemPrompt/prompt_preset_flies",
    "Nodes/PromptCardSelector/Built-in",
]